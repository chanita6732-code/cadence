<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Routa: three layered paths rising toward a destination. Redrawn as vectors from the owner's logo design. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="118"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1fb0"/>
      <stop offset=".38" stop-color="#150b3d"/>
      <stop offset=".7" stop-color="#090722"/>
      <stop offset="1" stop-color="#0c1140"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset=".5" stop-color="#6a4df0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3f6df0" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="road" x1="190" y1="140" x2="470" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset=".35" stop-color="#6f7df5"/>
      <stop offset=".7" stop-color="#3b62e0"/>
      <stop offset="1" stop-color="#2637b4"/>
    </linearGradient>
    <linearGradient id="side" x1="179" y1="190" x2="400" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d22c8"/>
      <stop offset="1" stop-color="#17116e"/>
    </linearGradient>
    <linearGradient id="dome" x1="30" y1="270" x2="380" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d08bff"/>
      <stop offset=".45" stop-color="#8f8cfb"/>
      <stop offset=".8" stop-color="#4fb4f6"/>
      <stop offset="1" stop-color="#3b6fe8"/>
    </linearGradient>
    <linearGradient id="lobe" x1="0" y1="350" x2="230" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d996ff"/>
      <stop offset=".55" stop-color="#9a5cf8"/>
      <stop offset="1" stop-color="#6d4af0"/>
    </linearGradient>
    <radialGradient id="dot" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#e6fff6"/>
      <stop offset=".45" stop-color="#4cecc0"/>
      <stop offset="1" stop-color="#2fc8e0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#4cecc0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4cecc0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <path d="M179 188 L179 512 L404 512 C402 400 362 300 282 262 C240 244 200 232 179 188 Z" fill="url(#side)"/>
    <path d="M327 130 C286 133 236 142 202 160 C186 169 179 179 179 190 C180 216 232 238 282 256 C352 282 398 345 402 512 L466 512 C468 398 456 292 414 236 C380 192 302 188 282 166 C270 152 298 138 327 130 Z" fill="url(#road)"/>
    <path d="M0 352 C40 298 110 256 172 256 C242 256 302 276 336 312 C366 346 373 420 373 512 L0 512 Z" fill="url(#dome)"/>
    <path d="M0 338 C62 330 134 336 202 386 C246 420 256 470 258 512 L224 512 C221 470 204 426 164 396 C110 360 50 354 0 360 Z" fill="#2a1596"/>
    <path d="M0 358 C50 352 114 358 164 396 C204 426 221 470 224 512 L0 512 Z" fill="url(#lobe)"/>
    <circle cx="386" cy="116" r="62" fill="url(#halo)"/>
    <circle cx="386" cy="116" r="43" fill="url(#dot)"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="url(#edge)" stroke-width="4"/>
</svg>
